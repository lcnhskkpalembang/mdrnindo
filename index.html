      {id:"请再说一遍。", syl:"qǐng zài shuō yí biàn", zh:"Tolong katakan sekali lagi.", ex:"对不起，请再说一遍。", exSyl:"duìbuqǐ, qǐng zài shuō yí biàn", exZh:"Maaf, tolong ulangi."},
      {id:"这是什么？", syl:"zhè shì shénme", zh:"Ini apa?", ex:"请问，这是什么？", exSyl:"qǐngwèn, zhè shì shénme", exZh:"Permisi, ini apa?"},
      {id:"那是什么？", syl:"nà shì shénme", zh:"Itu apa?", ex:"那是什么？很好看。", exSyl:"nà shì shénme, hěn hǎokàn", exZh:"Itu apa? Bagus sekali."},
      {id:"你在做什么？", syl:"nǐ zài zuò shénme", zh:"Kamu sedang melakukan apa?", ex:"嗨，你在做什么？", exSyl:"hāi, nǐ zài zuò shénme", exZh:"Hai, kamu sedang apa?"}
    ]
  };
  
  let currentCategory = "Salam & Ungkapan";
  let currentIndex = 0;
  let currentCards = [...data[currentCategory]];
  
  const categoriesEl = document.getElementById('categories');
  const cardEl = document.getElementById('card');
  const cardFrontEl = document.getElementById('cardFront');
  const cardBackEl = document.getElementById('cardBack');
  const progressEl = document.getElementById('progress');
  const progressFillEl = document.getElementById('progressFill');
  
  /* Helper: apakah kategori Mandarin? */
  function isChineseCategory(cat) {
    return cat.startsWith('中文');
  }
  
  /* Build category buttons */
  Object.keys(data).forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === currentCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = (e) => selectCategory(cat, e);
    categoriesEl.appendChild(btn);
  });
  
  function selectCategory(cat, e) {
    currentCategory = cat;
    currentIndex = 0;
    currentCards = [...data[cat]];
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    if (e && e.target) e.target.classList.add('active');
    renderCard();
  }
  
  function renderCard() {
    const item = currentCards[currentIndex];
    cardEl.classList.remove('flipped');
    cardEl.classList.remove('animate-in');
    void cardEl.offsetWidth;
    cardEl.classList.add('animate-in');
    
    const isZh = isChineseCategory(currentCategory);
    
    cardFrontEl.innerHTML = `
      <div class="category-tag">${currentCategory}</div>
      <div class="indonesian">${item.id}</div>
      <div class="syllable">${item.syl}</div>
      <div class="chinese">${item.zh}</div>
      <button class="audio-btn" onclick="playAudio(event)">🔊</button>
      <div class="audio-label">${isZh ? 'Tekan untuk dengar (中文)' : 'Tekan untuk dengar'}</div>
    `;
    
    const label1 = isZh ? '🇨🇳 Bahasa Mandarin' : '🇮🇩 Bahasa Indonesia';
    const label2 = isZh ? '🇮🇩 Bahasa Indonesia' : '🇨🇳 Bahasa Mandarin';
    const tagLabel = isZh ? '例句 Contoh Kalimat' : 'Contoh Kalimat';
    
    cardBackEl.innerHTML = `
      <div class="category-tag">${tagLabel}</div>
      <div class="example-sentence">
        <div class="label">${label1}</div>
        <div class="id">${item.ex}</div>
        <div class="syl">${item.exSyl}</div>
        <div class="zh">${label2} — ${item.exZh}</div>
      </div>
      <button class="audio-btn" style="margin-top:20px" onclick="playSentence(event)">🔊</button>
      <div class="audio-label">${isZh ? 'Dengar kalimat (中文)' : 'Dengar kalimat'}</div>
    `;
    
    progressEl.textContent = `${currentIndex + 1} / ${currentCards.length}`;
    progressFillEl.style.width = `${((currentIndex + 1) / currentCards.length) * 100}%`;
  }
  
  cardEl.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') cardEl.classList.toggle('flipped');
  });
  
  function playAudio(e) {
    if (e) e.stopPropagation();
    const item = currentCards[currentIndex];
    speak(item.id);
  }
  
  function playSentence(e) {
    if (e) e.stopPropagation();
    const item = currentCards[currentIndex];
    speak(item.ex);
  }
  
  function speak(text) {
    if (!('speechSynthesis' in window)) {
      alert('Browser Anda tidak mendukung fitur suara.');
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const isZh = isChineseCategory(currentCategory);
    utter.lang = isZh ? 'zh-CN' : 'id-ID';
    utter.rate = isZh ? 0.9 : 0.85;
    utter.pitch = 1;
    
    const btn = document.querySelector('.audio-btn:not([style*="margin"])');
    if (btn) {
      btn.classList.add('playing');
      utter.onend = () => btn.classList.remove('playing');
      utter.onerror = () => btn.classList.remove('playing');
    }
    
    const voices = window.speechSynthesis.getVoices();
    const langPrefix = isZh ? 'zh' : 'id';
    const v = voices.find(v => v.lang.toLowerCase().startsWith(langPrefix));
    if (v) utter.voice = v;
    
    window.speechSynthesis.speak(utter);
  }
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }
  
  function nextCard() {
    currentIndex = (currentIndex + 1) % currentCards.length;
    renderCard();
  }
  
  function prevCard() {
    currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
    renderCard();
  }
  
  function shuffleCards() {
    for (let i = currentCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
    }
    currentIndex = 0;
    renderCard();
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextCard();
    else if (e.key === 'ArrowLeft') prevCard();
    else if (e.key === ' ') { e.preventDefault(); playAudio(); }
    else if (e.key === 'Enter') cardEl.classList.toggle('flipped');
  });
  
  renderCard();
</script>

</body>
</html>
