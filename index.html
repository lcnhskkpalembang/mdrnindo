/* ============================================================
   TTS: PILIH VOICE BAHASA INDONESIA (ROBUST)
   ============================================================ */
let idVoice = null;
let voicesLoaded = false;

function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) {
    voicesLoaded = false;
    return false;
  }
  
  // Prioritas pencarian voice Indonesia
  idVoice =
    voices.find(v => v.lang.toLowerCase() === 'id-id') ||
    voices.find(v => v.lang.toLowerCase() === 'id_id') ||
    voices.find(v => v.lang.toLowerCase().startsWith('id-')) ||
    voices.find(v => v.lang.toLowerCase() === 'id') ||
    voices.find(v => v.name.toLowerCase().includes('indonesia')) ||
    voices.find(v => v.name.toLowerCase().includes('damayanti')) ||
    voices.find(v => v.name.toLowerCase().includes('andika')) ||
    voices.find(v => v.name.toLowerCase().includes('gadis')) ||
    voices.find(v => v.name.toLowerCase().includes('ardi')) ||
    null;
  
  voicesLoaded = true;
  
  console.log('%c🎙️ TTS Info', 'color: #5c6bc0; font-weight: bold;');
  console.log('   Voice Indonesia terpilih:', idVoice ? `"${idVoice.name}" (${idVoice.lang})` : '❌ TIDAK ADA');
  console.log('   Semua voice tersedia:', voices.map(v => `${v.name} [${v.lang}]`).join(', '));
  
  const warn = document.getElementById('voiceWarning');
  if (warn) {
    if (!idVoice) warn.classList.add('show');
    else warn.classList.remove('show');
  }
  
  return !!idVoice;
}

// Trigger load berkali-kali (Chrome bug)
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
  // Retry beberapa kali untuk memastikan voice sudah dimuat
  let retries = 0;
  const retryTimer = setInterval(() => {
    if (loadVoices() || ++retries > 20) clearInterval(retryTimer);
  }, 250);
}

/* ============================================================
   BERSIHKAN TEKS: HANYA SISAKAN HURUF LATIN + TANDA BACA DASAR
   ============================================================ */
function cleanTextForIndonesian(text) {
  if (!text) return '';
  return String(text)
    // Buang Hanzi & karakter CJK
    .replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g, '')
    // Buang diakritik pinyin (ā á ǎ à, ě, ī, ǒ, ū, ǖ dst)
    .replace(/[\u0100-\u024F\u0300-\u036F]/g, m => {
      const map = { 'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e',
                    'ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o',
                    'ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'ü','ǘ':'ü','ǚ':'ü','ǜ':'ü',
                    'ń':'n','ň':'n','ḿ':'m' };
      return map[m] || '';
    })
    // Buang tanda baca Mandarin & simbol aneh
    .replace(/[，。！？、；：""''《》【】（）〈〉「」『』…—－～·]/g, ' ')
    // Rapikan spasi
    .replace(/\s+/g, ' ')
    .trim();
}

/* ============================================================
   FUNGSI UTAMA TTS
   ============================================================ */
function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('Browser Anda tidak mendukung fitur suara.');
    return;
  }
  
  const clean = cleanTextForIndonesian(text);
  if (!clean) {
    console.warn('Text kosong setelah dibersihkan:', text);
    return;
  }
  
  // Pastikan voice sudah dimuat
  if (!voicesLoaded || !idVoice) loadVoices();
  
  window.speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(clean);
  // WAJIB: paksa lang id-ID
  utter.lang = 'id-ID';
  utter.rate = 0.85;
  utter.pitch = 1;
  utter.volume = 1;
  
  // Pilih voice Indonesia jika ada
  if (idVoice) {
    utter.voice = idVoice;
  } else {
    console.warn('⚠️ Voice id-ID tidak tersedia. Browser akan memakai voice default.');
  }
  
  const btn = document.querySelector('.audio-btn:not([style*="margin"])');
  if (btn) {
    btn.classList.add('playing');
    utter.onend = () => btn.classList.remove('playing');
    utter.onerror = () => btn.classList.remove('playing');
  }
  
  window.speechSynthesis.speak(utter);
}

function isChineseCategory(cat) { return cat.startsWith('中文'); }

Object.keys(data).forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (cat === currentCategory ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = (e) => selectCategory(cat, e);
  categoriesEl.appendChild(btn);
});

function selectCategory(cat, e) {
  currentCategory = cat;
  currentIndex = 0;
  currentCards = [...data[cat]];
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (e && e.target) e.target.classList.add('active');
  renderCard();
}

    cardFrontEl.innerHTML = `

      <div class="chinese">${item.id}</div>

      <button class="audio-btn" onclick="playAudio(event)">🔊</button>

        <div class="label">🇨🇳 Bahasa Mandarin</div>
        <div class="id">${item.ex}</div>
        <div class="syl">${splitIndo(item.exZh)}</div>
      </div>
      <button class="audio-btn" style="margin-top:20px" onclick="playSentence(event)">🔊</button>
      <div class="audio-label">Dengar kalimat</div>
    `;
  } else {
    cardFrontEl.innerHTML = `
      <div class="category-tag">${currentCategory}</div>
      <div class="indonesian">${item.id}</div>
      <div class="syllable">${item.syl}</div>
      <div class="chinese">${item.zh}</div>
      <button class="audio-btn" onclick="playAudio(event)">🔊</button>
      <div class="audio-label">Tekan untuk dengar</div>
    `;
    cardBackEl.innerHTML = `
      <div class="category-tag">Contoh Kalimat</div>
      <div class="example-sentence">
        <div class="label">🇮🇩 Bahasa Indonesia</div>
        <div class="id">${item.ex}</div>
        <div class="syl">${item.exSyl}</div>
        <div class="zh">🇨🇳 ${item.exZh}</div>
      </div>
      <button class="audio-btn" style="margin-top:20px" onclick="playSentence(event)">🔊</button>
      <div class="audio-label">Dengar kalimat</div>
    `;
  }
  
  progressEl.textContent = `${currentIndex + 1} / ${currentCards.length}`;
  progressFillEl.style.width = `${((currentIndex + 1) / currentCards.length) * 100}%`;
}

cardEl.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') cardEl.classList.toggle('flipped');
});

function playAudio(e) {
  if (e) e.stopPropagation();
  const item = currentCards[currentIndex];
  if (isChineseCategory(currentCategory)) {
    speak(item.zh);   // baca arti Indonesia
  } else {
    speak(item.id);   // baca kata Indonesia
  }
}

function playSentence(e) {
  if (e) e.stopPropagation();
  const item = currentCards[currentIndex];
  if (isChineseCategory(currentCategory)) {
    speak(item.exZh); // baca terjemahan Indonesia
  } else {
    speak(item.ex);   // baca kalimat Indonesia
  }
}

/* ============================================================
   PEMISAH SUKU KATA
   ============================================================ */
function splitWord(word) {
  if (!word || word.length < 2) return word;
  if (/^[A-Z]+$/.test(word) && word.length <= 4) return word;
  
  const lower = word.toLowerCase();
  const vowels = 'aiueo';
  const isV = c => vowels.includes(c);
  const digraphs = ['ng','ny','sy','kh'];
  const diphthongs = ['ai','au','ei','oi'];
  
  const result = [];
  let current = '';
  let i = 0;
  
  while (i < lower.length) {
    current += word[i];
    const c = lower[i];
    const next = lower[i+1];
    const nn = lower[i+2];
    
    if (i === lower.length - 1) break;
    
    let shouldBreak = false;
    
    if (isV(c) && next && isV(next)) {
      const pair = c + next;
      if (diphthongs.includes(pair)) {
        if (i + 2 !== lower.length) shouldBreak = true;
      } else {
        shouldBreak = true;
      }
    } else if (isV(c) && next && !isV(next)) {
      if (nn && isV(nn)) {
        const pair = next + nn;
        if (!digraphs.includes(pair)) shouldBreak = true;
      }
    } else if (!isV(c) && next && !isV(next)) {
      const pair = c + next;
      if (!digraphs.includes(pair)) shouldBreak = true;
    }
    
    if (shouldBreak) {
      result.push(current);
      current = '';
    }
    i++;
  }
  if (current) result.push(current);
  return result.length > 1 ? result.join('-') : word;
}

function splitIndo(text) {
  if (!text) return text;
  return text.split(/([a-zA-Z]+)/).map(part => {
    if (/^[a-zA-Z]+$/.test(part) && part.length > 1) return splitWord(part);
    return part;
  }).join('');
}

/* ============================================================
   NAVIGASI
   ============================================================ */
function nextCard() { currentIndex = (currentIndex + 1) % currentCards.length; renderCard(); }
function prevCard() { currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length; renderCard(); }
function shuffleCards() {
  for (let i = currentCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
  }
  currentIndex = 0;
  renderCard();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextCard();
  else if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === ' ') { e.preventDefault(); playAudio(); }
  else if (e.key === 'Enter') cardEl.classList.toggle('flipped');
});

renderCard();
</script>
